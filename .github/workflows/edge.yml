name: NHL EDGE V3 Collector
on:
  schedule:
    # 11 AM Toronto: 15:00 UTC in daylight time; 16:00 UTC in standard time.
    # Extra collection passes for delayed NHL results and evening game updates.
    - cron: '10 2,10,14,15,16,21,22 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Fetch previous and current seasons (first setup only)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: edge-database-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified NHL games and record pregame forecasts
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = 'true' ]; then python edge.py bootstrap; fi
          python edge.py collect
          # Schedule runs twice around DST. Only forecast at 11 AM Toronto.
          if [ "$(TZ=America/Toronto date +%H)" = '11' ]; then python edge.py forecast; fi
          python edge.py summary
          python - <<'PY'
          from edge import connect
          with connect() as db:
              db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          PY
      - name: Commit updated database
        run: |
          git config user.name 'nhl-edge-bot'
          git config user.email 'nhl-edge-bot@users.noreply.github.com'
          git add data/edge.sqlite
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified NHL game data and pregame forecasts'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
